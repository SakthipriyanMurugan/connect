<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Vertex Connect — Real-time Business Communication & Collaboration Workspace</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="Vertex Connect is a high-performance business communication platform featuring instant messaging, encrypted voice & video calls, AI meeting summaries, and enterprise collaboration." />
    <meta name="keywords" content="Vertex Connect, real-time messaging, video meetings, business communication, encrypted chat, enterprise collaboration" />
    <meta name="author" content="Vertex Connect Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vertex-connect.pages.dev" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vertex-connect.pages.dev" />
    <meta property="og:title" content="Vertex Connect — Real-time Business Communication" />
    <meta property="og:description" content="High-performance real-time business communication, encrypted messaging, HD audio/video calls, and enterprise collaboration platform." />
    <meta property="og:image" content="https://vertex-connect.pages.dev/favicon.svg" />
    <meta property="og:site_name" content="Vertex Connect" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://vertex-connect.pages.dev" />
    <meta name="twitter:title" content="Vertex Connect — Real-time Business Communication" />
    <meta name="twitter:description" content="High-performance real-time business communication, encrypted messaging, HD audio/video calls, and enterprise collaboration platform." />
    <meta name="twitter:image" content="https://vertex-connect.pages.dev/favicon.svg" />

    <!-- PWA & Mobile Web App -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vertex Connect" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Performance Preconnects -->
    <link rel="preconnect" href="https://vertex-connect-backend.koyeb.app" crossorigin />
    <link rel="dns-prefetch" href="https://vertex-connect-backend.koyeb.app" />

    <!-- JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Vertex Connect",
      "operatingSystem": "All",
      "applicationCategory": "BusinessApplication",
      "url": "https://vertex-connect.pages.dev",
      "description": "Enterprise-grade real-time business communication, encrypted messaging, and HD audio/video conferencing platform."
    }
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; text-align: center; color: #1e293b;">
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript in your browser to experience Vertex Connect.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
