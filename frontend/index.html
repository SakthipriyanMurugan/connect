<html lang="en">
  <head>

    <link rel="canonical" href="https://vertex-connect.pages.dev" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vertex-connect.pages.dev" />

    <meta name="twitter:url" content="https://vertex-connect.pages.dev" />

    <meta name="twitter:image" content="https://vertex-connect.pages.dev/favicon.svg" />

    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    {
      "@context": "https://schema.org",

      "name": "Vertex Connect",
      "operatingSystem": "All",
      "applicationCategory": "BusinessApplication",
      "url": "https://vertex-connect.pages.dev",
      "description": "Enterprise-grade real-time business communication, encrypted messaging, and HD audio/video conferencing platform."

  <body style="margin:0;background:#090d25;color:#eef1ff;">
