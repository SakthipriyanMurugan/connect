version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vertex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vertex_db
      POSTGRES_USER: vertex
      POSTGRES_PASSWORD: vertex_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vertex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: vertex-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: vertex_admin
      MINIO_ROOT_PASSWORD: vertex_minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
